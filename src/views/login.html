<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - FastWork</title>
  <link rel="shortcut icon" href="../public/images/Logo_FAVICON.png" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body {
      background:
        radial-gradient(circle at top, rgba(13, 110, 253, 0.22), transparent 28%),
        linear-gradient(180deg, #050505 0%, #0d1117 100%);
      min-height: 100vh;
    }
  </style>
</head>

<body class="text-light">
  <nav class="navbar navbar-dark navbar-expand-lg bg-black border-bottom border-primary">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html">
        <img src="../public/images/Logo_FAVICON.png" width="40" alt="Logo FastWork" />
        <span class="fw-bold fs-4">FastWork</span>
      </a>
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <a class="nav-link text-white-50 p-0" href="../../index.html">Início</a>
        <a class="nav-link active p-0" href="login.html">Entrar</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-xl-5">
        <div class="text-center mb-4">
          <p class="text-primary text-uppercase fw-semibold mb-2">Acesso</p>
          <h1 class="display-6 fw-bold mb-2">Entre na sua conta</h1>
          <p class="text-white-50 mb-0">Entre com seus dados cadastrados.</p>
        </div>

        <div id="cardLogin" class="card bg-black border-primary shadow-lg">
          <div class="card-body p-4 p-md-5">
            <div id="alertaErro" class="alert alert-danger d-none"></div>
            <div id="alertaSucesso" class="alert alert-success d-none"></div>

            <div class="btn-group w-100 mb-4" role="group">
              <input type="radio" class="btn-check" name="tipo" id="tipoProfissional" checked>
              <label class="btn btn-outline-primary" for="tipoProfissional">
                <i class="bi bi-person-fill"></i> Profissional
              </label>
              <input type="radio" class="btn-check" name="tipo" id="tipoEmpresa">
              <label class="btn btn-outline-primary" for="tipoEmpresa">
                <i class="bi bi-building"></i> Empresa
              </label>
            </div>

            <form id="formLogin" class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" required placeholder="Digite seu e-mail" />
                <div class="invalid-feedback">Informe um e-mail válido.</div>
              </div>
              <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" required placeholder="Digite sua senha" />
                <div class="invalid-feedback">Informe sua senha.</div>
              </div>
              <button type="submit" class="btn btn-primary w-100 btn-lg mb-4" id="btnEntrar">
                <i class="bi bi-box-arrow-in-right"></i> Entrar
              </button>
            </form>

            <p class="text-center mb-0">
              Ainda não tem conta?
              <a id="linkCadastro" href="formu.html" class="text-primary">Cadastre-se como Profissional</a>
            </p>
          </div>
        </div>

        <div id="cardPerfil" class="card bg-black border-primary shadow-lg d-none mt-4">
          <div class="card-body p-4 p-md-5 text-center">
            <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
              style="width:70px; height:70px; font-size:1.5rem;" id="avatarPerfil"></div>
            <h2 class="h4 mb-1" id="nomePerfil"></h2>
            <p class="text-white-50 mb-4" id="tipoPerfil"></p>
            <ul class="list-group list-group-flush text-start mb-4" id="infoPerfil"></ul>
            <button class="btn btn-outline-light w-100" onclick="sair()">
              <i class="bi bi-box-arrow-right"></i> Sair
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Sessão real: guarda o token JWT devolvido pela API + os dados do usuário/empresa.
    const SESSION_KEY = "fastwork_session";

    function tipoSelecionado() {
      return document.getElementById("tipoEmpresa").checked ? "empresa" : "profissional";
    }

    function mostrarAlerta(tipo, msg) {
      const id = tipo === "sucesso" ? "alertaSucesso" : "alertaErro";
      const outroId = tipo === "sucesso" ? "alertaErro" : "alertaSucesso";
      document.getElementById(outroId).classList.add("d-none");
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.remove("d-none");
    }

    function exibirPerfil(usuario, tipo) {
      document.getElementById("cardLogin").classList.add("d-none");
      document.getElementById("cardPerfil").classList.remove("d-none");

      const nomeExibido = usuario.nm_usuario || "";
      document.getElementById("avatarPerfil").textContent = nomeExibido.charAt(0).toUpperCase();
      document.getElementById("nomePerfil").textContent = nomeExibido;
      document.getElementById("tipoPerfil").textContent = tipo === "empresa" ? "Empresa" : "Profissional";

      document.getElementById("infoPerfil").innerHTML = `
        <li class="list-group-item bg-black text-light border-primary d-flex justify-content-between">
          <span class="text-white-50">E-mail</span><span>${usuario.ds_email || ""}</span>
        </li>`;
    }

    function sair() {
      localStorage.removeItem(SESSION_KEY);
      document.getElementById("cardPerfil").classList.add("d-none");
      document.getElementById("cardLogin").classList.remove("d-none");
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll('input[name="tipo"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          const link = document.getElementById("linkCadastro");
          if (tipoSelecionado() === "empresa") {
            link.href = "cadastroem.html";
            link.textContent = "Cadastre-se como Empresa";
          } else {
            link.href = "formu.html";
            link.textContent = "Cadastre-se como Profissional";
          }
        });
      });

      const sessao = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
      if (sessao) exibirPerfil(sessao.usuario, sessao.tipo);
    });

    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const form = e.target;

      if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
      }

      const ds_email = document.getElementById("email").value.trim();
      const ds_senha = document.getElementById("senha").value;
      const tipo = tipoSelecionado();
      const endpoint = tipo === "empresa" ? "/api/login/empresa" : "/api/login";

      const btn = document.getElementById("btnEntrar");
      btn.disabled = true;

      try {
        const resposta = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ds_email, ds_senha }),
        });
        const data = await resposta.json();

        if (!resposta.ok || !data.ok) {
          mostrarAlerta("erro", data.erro || "E-mail ou senha incorretos.");
          return;
        }

        const usuario = data.usuario || data.empresa;
        localStorage.setItem(SESSION_KEY, JSON.stringify({ token: data.token, usuario, tipo }));
        mostrarAlerta("sucesso", "Login realizado com sucesso!");
        setTimeout(() => exibirPerfil(usuario, tipo), 400);
      } catch (erro) {
        mostrarAlerta("erro", "Não foi possível conectar ao servidor. Tente novamente.");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
