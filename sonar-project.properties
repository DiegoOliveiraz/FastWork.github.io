# Configuração do SonarQube/SonarCloud para o FastWork.
# Mantida mínima de propósito: só exclusões. projectKey e organization ficam no
# painel do Sonar (ou entram aqui quando a análise passar para o CI, Lote 5).

# Bibliotecas de terceiros copiadas para o repositório não são código do projeto.
sonar.exclusions=src/public/vendor/**,src/public/images/**,docs/**
sonar.cpd.exclusions=src/public/vendor/**
sonar.coverage.exclusions=src/public/vendor/**,test/**,api/**
